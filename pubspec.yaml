name: ni_visa_dart
description: NI VISA Library for Dart via FFI.
version: 0.2.0
repository: https://github.com/djbird2046/ni_visa_dart

environment:
  sdk: ^3.4.3

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^15.0.0
  build_runner: ^2.4.14
  build: ^2.4.2
  lints: ^3.0.0
  test: ^1.24.0

ffigen:
  name: NIVisaFFI
  description: NI VISA Library for Dart via FFI.
  output: 'lib/src/ffi/ni_visa_ffi.dart'

  headers:
    entry-points:
      - 'include/visa.h'
    include-directives:
      - 'include/visa.h'
      - 'include/visatype.h'
      - 'include/vpptype.h'

  preamble: |
    // This file is auto-generated by ffigen. Do not edit.

  comments: true

#  macros:
#    rename:
#      '_VI_ERROR': 'VI_ERROR'